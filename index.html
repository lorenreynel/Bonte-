<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonte' POS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Raleway:wght@500;600;700&display=swap">
<style>
/* Layout: menu, sales log and stock on the left; a sticky order panel on the right. Smoky olive-charcoal ground with soft yellow-green glows, pill buttons and translucent rounded cards, after the reference. */
:root {
  --bg: #1b1a16;
  --surface: rgba(255, 255, 255, 0.05);
  --surface-2: rgba(255, 255, 255, 0.085);
  --line: rgba(255, 255, 255, 0.11);
  --fg: #f3f1e8;
  --muted: #a9a798;
  --sun: #f0d94e;
  --lime: #a8d95a;
  --grad: linear-gradient(90deg, #f0d94e, #a8d95a);
  --on-accent: #1d2010;
  --danger: #ff9b8a;
  --display: 'Raleway', 'Segoe UI', system-ui, sans-serif;
  --body: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: dark; background: #1b1a16; }
body { margin: 0; }
body {
  background:
    radial-gradient(55% 45% at 6% 2%, rgba(240, 217, 78, 0.2), transparent 62%),
    radial-gradient(45% 40% at 96% 14%, rgba(86, 120, 112, 0.3), transparent 62%),
    radial-gradient(60% 45% at 50% 100%, rgba(128, 104, 48, 0.22), transparent 66%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
h1, h2, h3, p, dl, dd { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.dot { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); flex: none; box-shadow: 0 0 36px rgba(200, 225, 90, 0.35); }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 6vw, 46px); line-height: 1.05; letter-spacing: -0.01em; }
.brand p { color: var(--muted); font-size: 13px; }
.top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; color: var(--muted); font-size: 12.5px; background: var(--surface); }

.btn { border-radius: 999px; border: 1px solid transparent; padding: 10px 20px; font-weight: 500; font-size: 13.5px; transition: transform 0.12s, opacity 0.12s, background 0.12s; }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--grad); color: var(--on-accent); font-weight: 600; }
.btn.ghost { background: transparent; border-color: rgba(255, 255, 255, 0.35); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { padding: 5px 12px; font-size: 12px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.unlock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface-2); }
.unlock label { color: var(--muted); font-size: 13px; }
.err { color: var(--danger); font-size: 13px; }

input[type="number"], input[type="password"], input[type="text"] {
  background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; width: 100%; min-width: 0;
}
input:disabled { opacity: 0.5; }
.unlock input { width: 130px; }

/* stats strip */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; padding: 20px 24px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.stat span { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 4.6vw, 34px); line-height: 1.2; font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 28px; align-items: start; margin-top: 28px; }
.col { display: flex; flex-direction: column; gap: 34px; min-width: 0; }
.eyebrow { color: var(--lime); font-size: 12px; margin-bottom: 2px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.2; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { border-radius: 999px; background: transparent; border: 1px solid var(--line); padding: 6px 16px; color: var(--muted); font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--grad); color: var(--on-accent); border-color: transparent; font-weight: 600; }

/* menu */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.prod { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); min-width: 0; transition: background 0.12s, transform 0.12s; }
.prod:hover:not(:disabled) { background: var(--surface-2); }
.prod:active:not(:disabled) { transform: scale(0.98); }
.prod:disabled { opacity: 0.45; cursor: not-allowed; }
.prod .cat { font-size: 11px; color: var(--lime); letter-spacing: 0.04em; text-transform: uppercase; }
.prod .nm { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.prod .pr { font-variant-numeric: tabular-nums; font-weight: 500; }
.prod .st { font-size: 12px; color: var(--muted); margin-top: 4px; }
.prod .st.low { color: var(--sun); }
.prod .st.out { color: var(--danger); }

/* tables and lists */
.scroll { overflow-x: auto; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 520px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--line); }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.empty { color: var(--muted); text-align: center; padding: 26px 16px; }
.link { background: none; border: 0; padding: 0; color: var(--sun); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }

.stock { display: grid; gap: 4px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); padding: 6px; }
.srow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(70px, 1fr) auto; align-items: center; gap: 12px; padding: 8px 10px; }
.srow .n { overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.09); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--grad); border-radius: 99px; }
.bar i.low { background: var(--danger); }
.srow .q { display: flex; align-items: center; gap: 10px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.srow .q b { min-width: 28px; text-align: right; font-weight: 600; }
.note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.pinrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.pinrow input { width: 150px; }

/* order panel */
.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; padding: 22px; border-radius: 28px; background: var(--surface-2); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.lines { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.line .ln { font-weight: 500; overflow-wrap: anywhere; }
.line .lt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.line small { color: var(--muted); }
.step { display: inline-flex; align-items: center; gap: 8px; }
.step button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.3); background: transparent; line-height: 1; padding: 0; }
.step button:disabled { opacity: 0.35; cursor: not-allowed; }
.step b { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.empty-note { color: var(--muted); padding: 18px 0; }
.sum { display: flex; flex-direction: column; gap: 10px; }
.sum .r { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sum dt { color: var(--muted); }
.sum dd { font-variant-numeric: tabular-nums; font-weight: 500; }
.sum .r input { width: 96px; text-align: right; }
.sum .total dt { color: var(--fg); font-family: var(--display); font-weight: 600; font-size: 18px; }
.sum .total dd { font-family: var(--display); font-weight: 700; font-size: 30px; }
.disc-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 12px; font-size: 12.5px; color: var(--muted); }
.disc-tools .btn { padding: 4px 12px; font-size: 12px; }
.field { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.field label { color: var(--muted); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.quick button { border-radius: 999px; border: 1px solid var(--line); background: transparent; padding: 4px 12px; font-size: 12.5px; }
.change { margin: 12px 0; min-height: 22px; font-weight: 500; }
.change.ok { color: var(--lime); }
.change.bad { color: var(--sun); }
.actions { display: flex; flex-direction: column; gap: 8px; }

/* receipt (paper) */
.paper { background: #f4f1e6; color: #1b1a16; border-radius: 18px; padding: 20px 18px; margin: 14px 0; font-family: 'Courier New', ui-monospace, monospace; font-size: 13px; line-height: 1.45; }
.paper .c { text-align: center; }
.paper .big { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
.paper hr { border: 0; border-top: 1px dashed #8d8a7a; margin: 10px 0; }
.paper .row { display: flex; justify-content: space-between; gap: 10px; }
.paper .row span:last-child { text-align: right; white-space: nowrap; }
.paper .sm { font-size: 12px; color: #55523f; }
.paper .tot { font-weight: 700; font-size: 15px; }
.pill-ok { display: inline-block; color: var(--on-accent); background: var(--grad); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 600; }

/* mobile cart bar */
.cartbar { display: none; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; }
  body { padding-bottom: 96px; }
  .cartbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; align-items: center; justify-content: space-between; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(27, 26, 22, 0.94); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .cartbar b { font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; }
}
@media (max-width: 520px) {
  .stats { padding: 16px; }
  .srow { grid-template-columns: minmax(0, 1fr) auto; }
  .srow .bar { grid-column: 1 / -1; order: 3; }
}
@media print { body * { visibility: hidden; } .paper, .paper * { visibility: visible; } .paper { position: absolute; left: 0; top: 0; width: 58mm; margin: 0; padding: 0; background: #fff; color: #000; border-radius: 0; font-size: 11px; } @page { size: 58mm auto; margin: 3mm; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <h1>Bonte'</h1>
        <p>Banana ice cream &amp; cold drinks</p>
      </div>
    </div>
    <div class="top-r">
      <span id="clock" class="chip"></span>
      <button id="cashierBtn" class="btn ghost" type="button">Cashier mode</button>
    </div>
  </header>

  <form id="unlockForm" class="unlock" hidden>
    <label for="pin">Cashier PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN">
    <button class="btn primary" type="submit">Unlock</button>
    <button class="btn ghost" type="button" id="unlockCancel">Cancel</button>
    <span id="pinErr" class="err" role="alert"></span>
  </form>

  <section class="stats" aria-label="Sales today summary">
    <div class="stat"><span>Orders</span><b id="stOrders">0</b></div>
    <div class="stat"><span>Items sold</span><b id="stItems">0</b></div>
    <div class="stat"><span>Sales today</span><b id="stSales">₱0.00</b></div>
  </section>

  <div class="layout">
    <main class="col">
      <section aria-labelledby="menuH">
        <div class="sec-head">
          <div><p class="eyebrow">Tap to add</p><h2 id="menuH">Menu</h2></div>
          <div class="filters" id="filters"></div>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <section aria-labelledby="salesH">
        <div class="sec-head"><div><p class="eyebrow" id="salesDate"></p><h2 id="salesH">Sales today</h2></div></div>
        <div class="scroll">
          <table>
            <thead><tr><th>Receipt</th><th>Time</th><th>Items</th><th class="num">Total</th></tr></thead>
            <tbody id="salesBody"></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="invH">
        <div class="sec-head"><div><p class="eyebrow">Updates after every order</p><h2 id="invH">Inventory</h2></div></div>
        <div class="stock" id="stock"></div>
        <p class="note" id="stockNote"></p>
        <div class="pinrow" id="pinChange" hidden>
          <label for="newPin" class="note" style="margin:0">New cashier PIN</label>
          <input id="newPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="4 to 8 digits">
          <button class="btn ghost small" type="button" id="savePin">Save PIN</button>
          <span class="note" id="pinMsg" style="margin:0"></span>
        </div>
      </section>
    </main>

    <aside class="panel" id="orderPanel" aria-label="Order">
      <div id="orderView">
        <h2>Current order</h2>
        <div class="lines" id="lines"></div>
        <dl class="sum">
          <div class="r"><dt>Subtotal</dt><dd id="sub">₱0.00</dd></div>
          <div class="r"><dt><label for="disc">Discount (%)</label></dt><dd><input id="disc" type="number" min="0" max="100" step="1" inputmode="decimal" value="0" disabled></dd></div>
        </dl>
        <div class="disc-tools" id="discTools"></div>
        <dl class="sum"><div class="r total"><dt>Total</dt><dd id="total">₱0.00</dd></div></dl>
        <div class="field">
          <label for="cash">Cash received (₱)</label>
          <input id="cash" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
        </div>
        <div class="quick" id="quick">
          <button type="button" data-q="exact">Exact</button>
          <button type="button" data-q="100">100</button>
          <button type="button" data-q="200">200</button>
          <button type="button" data-q="500">500</button>
          <button type="button" data-q="1000">1000</button>
        </div>
        <p class="change" id="change" aria-live="polite"></p>
        <div class="actions">
          <button class="btn primary block" id="place" type="button" disabled>Place order</button>
          <button class="btn ghost block" id="clear" type="button">Clear order</button>
        </div>
      </div>

      <div id="receiptView" hidden>
        <span class="pill-ok">Order placed</span>
        <div id="receiptBox"></div>
        <div class="actions">
          <button class="btn primary block" id="printRcpt" type="button">Print receipt</button>
          <button class="btn ghost block" id="saveRcpt" type="button" hidden>Save receipt</button>
          <button class="btn ghost block" id="newOrder" type="button">New order</button>
        </div>
        <p class="note" id="printNote"></p>
      </div>
    </aside>
  </div>
</div>

<div class="cartbar" id="cartbar">
  <div><span style="color:var(--muted);font-size:12px" id="cbCount">0 items</span><br><b id="cbTotal">₱0.00</b></div>
  <button class="btn primary" id="cbGo" type="button">View order</button>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var PAR = 40;
  var PRODUCTS = [
    { id: 'cup', name: 'Banana Ice Cream Cup', cat: 'Ice cream', price: 45, stock: 40 },
    { id: 'cone', name: 'Banana Ice Cream Cone', cat: 'Ice cream', price: 35, stock: 40 },
    { id: 'choco', name: 'Banana Choco Swirl', cat: 'Ice cream', price: 55, stock: 30 },
    { id: 'split', name: 'Banana Split', cat: 'Ice cream', price: 85, stock: 20 },
    { id: 'float', name: 'Banana Float', cat: 'Ice cream', price: 75, stock: 20 },
    { id: 'shake', name: 'Banana Shake', cat: 'Cold drinks', price: 65, stock: 30 },
    { id: 'coffee', name: 'Iced Coffee', cat: 'Cold drinks', price: 60, stock: 30 },
    { id: 'tea', name: 'Iced Tea', cat: 'Cold drinks', price: 35, stock: 40 },
    { id: 'lemon', name: 'Lemonade', cat: 'Cold drinks', price: 40, stock: 40 },
    { id: 'buko', name: 'Buko Juice', cat: 'Cold drinks', price: 45, stock: 30 },
    { id: 'water', name: 'Bottled Water', cat: 'Cold drinks', price: 20, stock: 50 }
  ];
  var byId = {};
  PRODUCTS.forEach(function (p) { byId[p.id] = p; });

  var KEY = 'bonte-pos-v1';
  function load() { try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
  var saved = load() || {};
  var stock = saved.stock || {};
  PRODUCTS.forEach(function (p) { if (typeof stock[p.id] !== 'number') stock[p.id] = p.stock; });
  var sales = saved.sales || [];
  var seq = saved.seq || { day: '', n: 0 };
  var pin = saved.pin || '1234';
  function persist() { try { localStorage.setItem(KEY, JSON.stringify({ stock: stock, sales: sales, seq: seq, pin: pin })); } catch (e) {} }

  var cart = {}, filter = 'All', unlocked = false, discount = 0, lastSale = null, dl = null;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(c) { return '₱' + (c / 100).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dayKey(d) { return d.toLocaleDateString('en-CA'); }
  function timeStr(ts) { return new Date(ts).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }); }
  function dateStr(ts) { return new Date(ts).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' }); }
  function todaySales() { var k = dayKey(new Date()); return sales.filter(function (s) { return s.day === k; }); }

  function calc() {
    var sub = 0, count = 0;
    Object.keys(cart).forEach(function (id) { sub += byId[id].price * 100 * cart[id]; count += cart[id]; });
    var d = Math.min(100, Math.max(0, discount));
    var disc = Math.round(sub * d / 100);
    return { sub: sub, disc: disc, total: sub - disc, count: count, d: d };
  }
  function cashC() { var v = parseFloat($('#cash').value); return isFinite(v) && v > 0 ? Math.round(v * 100) : 0; }
  function left(id) { return stock[id] - (cart[id] || 0); }

  /* ---------- render ---------- */
  function renderFilters() {
    var cats = ['All', 'Ice cream', 'Cold drinks'];
    $('#filters').innerHTML = cats.map(function (c) {
      return '<button type="button" data-f="' + c + '" aria-pressed="' + (c === filter) + '">' + c + '</button>';
    }).join('');
  }
  function renderProducts() {
    $('#grid').innerHTML = PRODUCTS.filter(function (p) { return filter === 'All' || p.cat === filter; }).map(function (p) {
      var l = left(p.id);
      var st = l <= 0 ? '<span class="st out">Sold out</span>' : l <= 5 ? '<span class="st low">Only ' + l + ' left</span>' : '<span class="st">' + l + ' in stock</span>';
      return '<button type="button" class="prod" data-id="' + p.id + '"' + (l <= 0 ? ' disabled' : '') + '><span class="cat">' + p.cat + '</span><span class="nm">' + esc(p.name) + '</span><span class="pr">' + fmt(p.price * 100) + '</span>' + st + '</button>';
    }).join('');
  }
  function renderLines() {
    var ids = Object.keys(cart);
    if (!ids.length) { $('#lines').innerHTML = '<p class="empty-note">No items yet. Tap an item on the menu to start an order.</p>'; return; }
    $('#lines').innerHTML = ids.map(function (id) {
      var p = byId[id], q = cart[id];
      return '<div class="line"><span class="ln">' + esc(p.name) + '</span><span class="lt">' + fmt(p.price * 100 * q) + '</span>' +
        '<span class="step"><button type="button" data-dec="' + id + '" aria-label="Remove one ' + esc(p.name) + '">−</button><b>' + q + '</b><button type="button" data-inc="' + id + '" aria-label="Add one ' + esc(p.name) + '"' + (left(id) <= 0 ? ' disabled' : '') + '>+</button></span>' +
        '<small style="text-align:right">' + fmt(p.price * 100) + ' each</small></div>';
    }).join('');
  }
  function renderTotals() {
    var c = calc(), cash = cashC();
    $('#sub').textContent = fmt(c.sub);
    $('#total').textContent = fmt(c.total);
    $('#cbCount').textContent = c.count + (c.count === 1 ? ' item' : ' items');
    $('#cbTotal').textContent = fmt(c.total);
    var ch = $('#change');
    ch.className = 'change';
    if (!c.count) { ch.textContent = 'Add items to start an order.'; }
    else if (cash < c.total) { ch.textContent = 'Short by ' + fmt(c.total - cash); ch.className = 'change bad'; }
    else { ch.textContent = 'Change ' + fmt(cash - c.total); ch.className = 'change ok'; }
    $('#place').disabled = !(c.count > 0 && cash >= c.total);
  }
  function renderOrder() { renderLines(); renderTotals(); }
  function renderStats() {
    var t = todaySales(), items = 0, sum = 0;
    t.forEach(function (s) { sum += s.total; s.items.forEach(function (i) { items += i.qty; }); });
    $('#stOrders').textContent = t.length;
    $('#stItems').textContent = items;
    $('#stSales').textContent = fmt(sum);
    $('#salesDate').textContent = new Date().toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric' });
  }
  function renderSales() {
    var t = todaySales().slice().reverse();
    if (!t.length) { $('#salesBody').innerHTML = '<tr><td class="empty" colspan="4">No sales yet today. Completed orders appear here.</td></tr>'; return; }
    $('#salesBody').innerHTML = t.map(function (s) {
      return '<tr><td><button type="button" class="link" data-rc="' + esc(s.no) + '">' + esc(s.no) + '</button></td><td>' + timeStr(s.ts) + '</td><td>' +
        s.items.map(function (i) { return i.qty + '× ' + esc(i.name); }).join(', ') + '</td><td class="num">' + fmt(s.total) + '</td></tr>';
    }).join('');
  }
  function renderStock() {
    $('#stock').innerHTML = PRODUCTS.map(function (p) {
      var n = stock[p.id], w = Math.min(100, Math.round(n / PAR * 100));
      return '<div class="srow"><span class="n">' + esc(p.name) + '</span><span class="bar"><i class="' + (n <= 5 ? 'low' : '') + '" style="width:' + w + '%"></i></span>' +
        '<span class="q"><b>' + n + '</b><button type="button" class="btn ghost small" data-rs="' + p.id + '"' + (unlocked ? '' : ' disabled') + '>+10</button></span></div>';
    }).join('');
    $('#stockNote').textContent = unlocked ? 'Stock goes down automatically when an order is placed. Use +10 after a delivery.' : 'Stock goes down automatically when an order is placed. Restocking needs cashier mode.';
  }
  function renderLock() {
    $('#disc').disabled = !unlocked;
    $('#cashierBtn').textContent = unlocked ? 'Cashier mode on · Lock' : 'Cashier mode';
    $('#pinChange').hidden = !unlocked;
    $('#discTools').innerHTML = unlocked
      ? '<span>Quick:</span><button type="button" class="btn ghost" data-d="5">5%</button><button type="button" class="btn ghost" data-d="10">10%</button><button type="button" class="btn ghost" data-d="20">Senior / PWD 20%</button>'
      : '<span>Discounts are set by the cashier only.</span><button type="button" class="btn ghost" id="discUnlock">Cashier unlock</button>';
    renderStock();
  }
  function setDiscount(v) {
    discount = Math.min(100, Math.max(0, isFinite(v) ? v : 0));
    $('#disc').value = String(discount);
    renderTotals();
  }

  /* ---------- receipt ---------- */
  function receiptInner(s) {
    var rows = s.items.map(function (i) {
      return '<div class="row"><span>' + esc(i.name) + '</span><span>' + fmt(i.price * 100 * i.qty) + '</span></div><div class="sm">' + i.qty + ' × ' + fmt(i.price * 100) + '</div>';
    }).join('');
    return '<div class="c"><div class="big">Bonte\'</div><div class="sm">Banana ice cream &amp; cold drinks</div></div><hr>' +
      '<div class="row"><span>Receipt</span><span>' + esc(s.no) + '</span></div>' +
      '<div class="row"><span>' + dateStr(s.ts) + '</span><span>' + timeStr(s.ts) + '</span></div><hr>' + rows + '<hr>' +
      '<div class="row"><span>Subtotal</span><span>' + fmt(s.sub) + '</span></div>' +
      (s.disc > 0 ? '<div class="row"><span>Discount (' + s.d + '%)</span><span>−' + fmt(s.disc) + '</span></div>' : '') +
      '<div class="row tot"><span>Total</span><span>' + fmt(s.total) + '</span></div>' +
      '<div class="row"><span>Cash</span><span>' + fmt(s.cash) + '</span></div>' +
      '<div class="row"><span>Change</span><span>' + fmt(s.change) + '</span></div><hr>' +
      '<div class="c sm">Salamat po! Balik kayo.</div>';
  }
  function receiptFile(s) {
    var css = '@page{size:58mm auto;margin:3mm}body{font:12px/1.45 "Courier New",monospace;color:#000;width:52mm;margin:0 auto}.c{text-align:center}.big{font-size:20px;font-weight:700}.sm{font-size:11px}hr{border:0;border-top:1px dashed #000;margin:6px 0}.row{display:flex;justify-content:space-between;gap:6px}.tot{font-weight:700;font-size:14px}';
    return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(s.no) + '</title><style>' + css + '</style></head><body>' + receiptInner(s) + '</body></html>';
  }
  function showReceipt(s) {
    lastSale = s;
    $('#receiptBox').innerHTML = '<div class="paper">' + receiptInner(s) + '</div>';
    $('#orderView').hidden = true;
    $('#receiptView').hidden = false;
    $('#printNote').textContent = dl ? 'Print receipt is sized for 58 mm paper. Save receipt keeps a copy as a file.' : 'Saving is not available in this view.';
    $('#saveRcpt').hidden = !dl;
    $('#orderPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function newOrder() {
    lastSale = null;
    $('#receiptView').hidden = true;
    $('#orderView').hidden = false;
    renderAll();
  }

  /* ---------- actions ---------- */
  function placeOrder() {
    var c = calc(), cash = cashC();
    if (!c.count || cash < c.total) return;
    var ids = Object.keys(cart);
    for (var k = 0; k < ids.length; k++) { if (cart[ids[k]] > stock[ids[k]]) { renderAll(); return; } }
    var now = new Date(), day = dayKey(now);
    if (seq.day !== day) seq = { day: day, n: 0 };
    seq.n += 1;
    var no = 'BN-' + day.slice(5).replace('-', '') + '-' + String(seq.n).padStart(3, '0');
    var items = ids.map(function (id) { return { id: id, name: byId[id].name, qty: cart[id], price: byId[id].price }; });
    items.forEach(function (i) { stock[i.id] -= i.qty; });
    var sale = { no: no, ts: now.getTime(), day: day, items: items, sub: c.sub, d: c.d, disc: c.disc, total: c.total, cash: cash, change: cash - c.total };
    sales.push(sale);
    persist();
    cart = {};
    $('#cash').value = '';
    setDiscount(0);
    renderAll();
    showReceipt(sale);
  }
  function renderAll() { renderProducts(); renderOrder(); renderStats(); renderSales(); renderStock(); }

  /* ---------- events ---------- */
  $('#filters').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; filter = b.getAttribute('data-f'); renderFilters(); renderProducts(); });
  $('#grid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-id]'); if (!b) return;
    var id = b.getAttribute('data-id');
    if (left(id) <= 0) return;
    if (!$('#receiptView').hidden) newOrder();
    cart[id] = (cart[id] || 0) + 1;
    renderProducts(); renderOrder();
  });
  $('#lines').addEventListener('click', function (e) {
    var inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]');
    if (inc) { var i = inc.getAttribute('data-inc'); if (left(i) > 0) cart[i] += 1; }
    if (dec) { var d = dec.getAttribute('data-dec'); cart[d] -= 1; if (cart[d] <= 0) delete cart[d]; }
    if (inc || dec) { renderProducts(); renderOrder(); }
  });
  $('#clear').addEventListener('click', function () { cart = {}; $('#cash').value = ''; setDiscount(0); renderProducts(); renderOrder(); });
  $('#place').addEventListener('click', placeOrder);
  $('#cash').addEventListener('input', renderTotals);
  $('#disc').addEventListener('input', function () { if (unlocked) setDiscount(parseFloat($('#disc').value)); });
  $('#quick').addEventListener('click', function (e) {
    var b = e.target.closest('[data-q]'); if (!b) return;
    var q = b.getAttribute('data-q');
    $('#cash').value = q === 'exact' ? (calc().total / 100).toFixed(2) : q;
    renderTotals();
  });
  $('#discTools').addEventListener('click', function (e) {
    if (e.target.id === 'discUnlock') { openUnlock(); return; }
    var b = e.target.closest('[data-d]'); if (b && unlocked) setDiscount(parseFloat(b.getAttribute('data-d')));
  });
  $('#salesBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rc]'); if (!b) return;
    var no = b.getAttribute('data-rc');
    var s = sales.filter(function (x) { return x.no === no && x.day === dayKey(new Date()); })[0];
    if (s) showReceipt(s);
  });
  $('#stock').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rs]'); if (!b || !unlocked) return;
    var id = b.getAttribute('data-rs'); stock[id] += 10; persist(); renderStock(); renderProducts();
  });
  $('#newOrder').addEventListener('click', newOrder);
  $('#printRcpt').addEventListener('click', function () { window.print(); });
  $('#saveRcpt').addEventListener('click', function () {
    if (!dl || !lastSale) return;
    dl.save({ filename: 'receipt-' + lastSale.no + '.html', data: receiptFile(lastSale) }).catch(function () {});
  });
  $('#cbGo').addEventListener('click', function () { $('#orderPanel').scrollIntoView({ behavior: 'smooth', block: 'start' }); });

  function openUnlock() { $('#unlockForm').hidden = false; $('#pinErr').textContent = ''; $('#pin').value = ''; $('#pin').focus(); }
  $('#cashierBtn').addEventListener('click', function () {
    if (unlocked) { unlocked = false; setDiscount(0); renderLock(); return; }
    if ($('#unlockForm').hidden) openUnlock(); else $('#unlockForm').hidden = true;
  });
  $('#unlockCancel').addEventListener('click', function () { $('#unlockForm').hidden = true; });
  $('#unlockForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($('#pin').value === pin) { unlocked = true; $('#unlockForm').hidden = true; $('#pin').value = ''; renderLock(); }
    else { $('#pinErr').textContent = 'Wrong PIN. Try again.'; $('#pin').value = ''; }
  });
  $('#savePin').addEventListener('click', function () {
    var v = $('#newPin').value;
    if (!/^\d{4,8}$/.test(v)) { $('#pinMsg').textContent = 'Use 4 to 8 digits.'; return; }
    pin = v; persist(); $('#newPin').value = ''; $('#pinMsg').textContent = 'PIN updated.';
  });

  function tick() { $('#clock').textContent = new Date().toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  tick(); setInterval(tick, 30000);

  renderFilters(); renderLock(); renderAll();
  dl = {
    save: function (o) {
      return new Promise(function (resolve) {
        var url = URL.createObjectURL(new Blob([o.data], { type: 'text/html' }));
        var a = document.createElement('a');
        a.href = url; a.download = o.filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        resolve({ status: 'saved' });
      });
    }
  };
})();
</script>

</body>
</html>
